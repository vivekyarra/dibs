name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod verify
        run: go mod verify
      - name: go vet
        run: go vet ./...
      - name: gofmt
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go test (race)
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: go test
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      - name: go build
        if: hashFiles('cmd/dibs/main.go') != ''
        run: go build ./cmd/dibs
      - name: template is up to date
        if: runner.os == 'Linux' && hashFiles('cmd/dibs/main.go') != ''
        run: go run ./cmd/dibs template --check
      - name: offline demo smoke test
        if: runner.os == 'Linux' && hashFiles('cmd/dibs/main.go') != ''
        run: go run ./cmd/dibs demo --out "$RUNNER_TEMP/demo"
      - name: upload demo output
        if: runner.os == 'Linux' && hashFiles('cmd/dibs/main.go') != ''
        uses: actions/upload-artifact@v7
        with:
          name: demo-output
          path: ${{ runner.temp }}/demo
          if-no-files-found: error
          retention-days: 14

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: test with coverage
        run: go test -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: enforce coverage >= 75%
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')"
          echo "Total coverage: ${total}%"
          echo "### Go coverage: ${total}%" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v t="$total" 'BEGIN { exit (t + 0 >= 75) ? 0 : 1 }'; then
            echo "::error::Coverage ${total}% is below the 75% threshold"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 14

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  template-upstream:
    name: template (upstream linter)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: lint template with upstream Switch linter
        if: hashFiles('switch/dibs.template.yaml') != ''
        run: bash scripts/lint_template_upstream.sh

  demo-shop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: examples/demo-shop
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        if: hashFiles('examples/demo-shop/pyproject.toml') != ''
        with:
          enable-cache: true
          cache-dependency-glob: examples/demo-shop/uv.lock
      - name: pytest
        if: hashFiles('examples/demo-shop/pyproject.toml') != ''
        run: uv run pytest -q
