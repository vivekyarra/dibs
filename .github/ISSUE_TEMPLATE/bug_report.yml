name: Bug report
description: Something in dibs behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and its JSON output (redact secrets).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. dibs ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: dibs version
      description: Output of `dibs --version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / arch
      placeholder: e.g. Windows 11 amd64, macOS 15 arm64
