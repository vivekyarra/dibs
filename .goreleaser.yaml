# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: dibs

before:
  hooks:
    - go mod tidy -diff
    - go mod verify

builds:
  - id: dibs
    main: ./cmd/dibs
    binary: dibs
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: dibs
    ids: [dibs]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # files: defaults (LICENSE*, README*, CHANGELOG*; missing ones are skipped)

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "Merge pull request"
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: vivekyarra
    name: dibs
  draft: false
  prerelease: auto
  name_template: "dibs {{ .Tag }}"
